<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MdReader</title>
<link rel="stylesheet" href="vendor/github.min.css">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<style>
  :root {
    --bg: #fcfcfb;
    --panel: #f6f7f8;
    --hover: #eceef1;
    --text: #2b3038;
    --strong: #1a1e24;
    --muted: #8b929d;
    --line: #eceef1;
    --accent: #27478f;
    --accent-soft: #e8edf8;
    --code-bg: #f3f4f6;
    --quote: #d3d7de;
    --warn: #d9822b;
    --font-size: 18px;
    --width: 720px;
    --font-body: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --font-ui: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "D2Coding", Consolas, monospace;
  }
  :root[data-theme="paper"] {
    --bg: #fbf8f1; --panel: #f4f0e6; --hover: #ebe5d5; --text: #34302a; --strong: #221f1a;
    --muted: #8f887a; --line: #ebe5d5; --accent: #9a5b13; --accent-soft: #f1e6d2;
    --code-bg: #f0ebdd; --quote: #d8d0bb;
  }
  :root[data-font="serif"] { --font-body: "Noto Serif KR", "Batang", Georgia, serif; }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 13px;
    display: grid; grid-template-rows: 44px 1fr 28px; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--hover); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--quote); background-clip: content-box; border: 2px solid transparent; }

  /* ---------- top bar ---------- */
  header { display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 14px; color: var(--strong); letter-spacing: -.02em; padding: 0 6px; }
  .icon-btn { height: 28px; min-width: 28px; padding: 0 8px; border-radius: 6px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .icon-btn:hover { background: var(--hover); color: var(--strong); }
  .icon-btn.on { color: var(--accent); background: var(--accent-soft); }
  .icon-btn:disabled { opacity: .4; cursor: default; background: none; color: var(--muted); }
  .crumb { flex: 1; min-width: 0; text-align: center; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb b { color: var(--strong); font-weight: 600; }
  .seg { display: inline-flex; background: var(--panel); border-radius: 7px; padding: 2px; }
  .seg button { height: 24px; padding: 0 9px; border-radius: 5px; font-size: 12px; color: var(--muted); }
  .seg button:hover { color: var(--strong); }
  .seg button.on { background: var(--bg); color: var(--strong); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .primary { height: 28px; padding: 0 12px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; }
  .primary:hover { opacity: .9; }
  .secondary { height: 28px; padding: 0 12px; border-radius: 6px; background: var(--panel); color: var(--strong); font-size: 12px; display: inline-flex; align-items: center; }
  .secondary:hover { background: var(--hover); }
  .tools { display: flex; align-items: center; gap: 8px; }

  /* ---------- body ---------- */
  .main { display: flex; min-height: 0; }
  .side { background: var(--panel); display: flex; flex-direction: column; min-height: 0; flex-shrink: 0; }
  #files { width: 272px; border-right: 1px solid var(--line); }
  #outline { width: 236px; border-left: 1px solid var(--line); }
  .side.hidden { display: none; }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .search { margin: 0 12px 8px; }
  .search input {
    width: 100%; height: 30px; border: 0; border-radius: 6px; background: var(--bg); padding: 0 10px;
    font: inherit; font-size: 12px; color: var(--text); outline: 1px solid var(--line);
  }
  .search input:focus { outline-color: var(--accent); }
  .scroll { overflow-y: auto; flex: 1; padding: 0 8px 16px; }

  /* tree */
  .row { display: flex; align-items: center; gap: 6px; height: 28px; padding-right: 8px; border-radius: 6px; cursor: pointer; color: var(--text); white-space: nowrap; user-select: none; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row .ico { width: 14px; text-align: center; color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .row.active .ico { color: var(--accent); }
  .row.dir { font-weight: 600; color: var(--strong); }
  .row .fold { font-size: 14px; line-height: 1; flex-shrink: 0; margin-right: -2px; }
  .row .sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
  .row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); line-height: 1.7; font-size: 12px; }
  .empty .primary { margin-top: 12px; }
  .empty .ghost { display: block; margin: 8px auto 0; color: var(--accent); font-size: 12px; }

  /* outline */
  #tocList a { display: block; padding: 5px 10px; margin: 1px 0; border-radius: 6px; color: var(--muted); text-decoration: none; line-height: 1.45; font-size: 12.5px; }
  #tocList a:hover { color: var(--strong); background: var(--hover); }
  #tocList a.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  #tocList a.l2 { padding-left: 20px; } #tocList a.l3 { padding-left: 30px; } #tocList a.l4 { padding-left: 40px; }

  /* ---------- center: tabs + panes ---------- */
  #center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #tabbar { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  #tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; align-items: center; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 12px; border-radius: 6px; color: var(--muted); cursor: pointer; white-space: nowrap; max-width: 200px; flex-shrink: 0; }
  .tab:hover { background: var(--hover); }
  .tab.active { background: var(--bg); color: var(--strong); box-shadow: 0 1px 2px rgba(0,0,0,.07); }
  .tab .t { overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
  .tab .x { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; color: var(--muted); position: relative; }
  .tab .x:hover { background: var(--hover); color: var(--strong); }
  .tab.dirty .x::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); position: absolute; }
  .tab.dirty .x span { opacity: 0; }
  .tab.dirty:hover .x::before { display: none; }
  .tab.dirty:hover .x span { opacity: 1; }
  .spacer { flex: 1; }

  #panes { flex: 1; display: flex; min-height: 0; }
  #editorPane { flex: 1 1 0; min-width: 0; display: flex; justify-content: center; background: var(--bg); padding: 0 8px; }
  #editor {
    flex: 1; max-width: 860px; height: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
    font-family: var(--font-mono); font-size: 14px; line-height: 1.8; padding: 36px 28px 120px; tab-size: 2;
  }
  body[data-mode="view"] #editorPane { display: none; }
  body[data-mode="edit"] #scroller { display: none; }
  body[data-mode="split"] #editorPane { border-right: 1px solid var(--line); }
  body[data-mode="split"] #scroller { flex: 1 1 0; }
  body[data-mode="split"] article { padding: 40px 36px 140px; }

  /* ---------- reader ---------- */
  #scroller { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg); }
  article {
    max-width: calc(var(--width) + 96px); margin: 0 auto; padding: 72px 48px 180px;
    font-family: var(--font-body); font-size: var(--font-size); line-height: 1.9;
    word-break: keep-all; overflow-wrap: break-word;
  }
  article h1, article h2, article h3, article h4 { color: var(--strong); line-height: 1.4; font-weight: 700; letter-spacing: -.015em; scroll-margin-top: 28px; }
  article h1 { font-size: 2em; margin: 0 0 1em; }
  article h2 { font-size: 1.5em; margin: 2.4em 0 .7em; }
  article h3 { font-size: 1.22em; margin: 1.9em 0 .5em; }
  article h4 { font-size: 1.05em; margin: 1.6em 0 .4em; }
  article p { margin: 0 0 1.2em; }
  article a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
  article ul, article ol { padding-left: 1.5em; margin: 0 0 1.2em; }
  article li { margin: .3em 0; }
  article li > p { margin: 0; }
  article blockquote { margin: 1.5em 0; padding: .2em 1.2em; border-left: 3px solid var(--quote); color: var(--muted); }
  article hr { border: 0; height: 1px; background: var(--line); margin: 3em 0; }
  article img { max-width: 100%; border-radius: 8px; }
  article code { font-family: var(--font-mono); font-size: .84em; background: var(--code-bg); padding: .15em .4em; border-radius: 4px; }
  article pre { background: var(--code-bg); border-radius: 8px; padding: 18px 20px; overflow-x: auto; margin: 1.5em 0; line-height: 1.65; position: relative; }
  article pre code { background: none; padding: 0; font-size: .8em; }
  article pre .copy { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 3px 8px; border-radius: 5px; opacity: 0; background: var(--bg); color: var(--muted); }
  article pre:hover .copy { opacity: 1; }
  .hljs { background: transparent !important; }
  article table { border-collapse: collapse; margin: 1.5em 0; width: 100%; font-size: .92em; display: block; overflow-x: auto; }
  article th, article td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  article th { background: var(--panel); font-weight: 600; color: var(--strong); }
  article input[type=checkbox] { margin-right: .5em; }

  #welcome { height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px; }
  #welcome .box { text-align: center; color: var(--muted); line-height: 1.8; max-width: 380px; }
  #welcome h2 { color: var(--strong); margin: 0 0 6px; font-size: 20px; letter-spacing: -.02em; }
  #welcome .actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  body.dragging #scroller, body.dragging #editorPane { background: var(--accent-soft); }

  #toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%); background: var(--strong); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
  #toast.show { opacity: .94; }

  /* ---------- status bar ---------- */
  footer { display: flex; align-items: center; gap: 16px; padding: 0 14px; background: var(--panel); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  footer .path { font-family: var(--font-mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: auto; }
  footer .bar { width: 90px; height: 4px; border-radius: 4px; background: var(--hover); overflow: hidden; }
  footer .bar i { display: block; height: 100%; width: 0; background: var(--accent); }

  @media (max-width: 1100px) { #outline { display: none; } }
  @media (max-width: 800px) { #files { display: none; } article { padding: 36px 20px 120px; } .crumb, .hide-sm { display: none; } }
  @media print { header, footer, .side, #tabbar, #editorPane { display: none !important; } body { display: block; overflow: visible; } #scroller { overflow: visible; display: block !important; } }
</style>
</head>
<body data-mode="view">
<header>
  <button class="icon-btn" id="toggleFiles" title="파일 탐색기 (B)">☰</button>
  <div class="brand">MdReader</div>
  <div class="crumb" id="crumb"></div>
  <div class="tools">
    <div class="seg"><button id="fontDown" title="글자 작게">A−</button><button id="fontUp" title="글자 크게">A+</button></div>
    <div class="seg hide-sm"><button data-font="sans">고딕</button><button data-font="serif">명조</button></div>
    <div class="seg hide-sm"><button data-theme="white">화이트</button><button data-theme="paper">페이퍼</button></div>
    <button class="primary" id="openFile">파일 열기</button>
    <button class="icon-btn" id="toggleToc" title="목차 (T)">목차</button>
  </div>
</header>

<div class="main">
  <aside class="side" id="files">
    <div class="side-head"><span id="folderName">탐색기</span><button class="icon-btn" id="openFolder" title="폴더 열기" style="height:22px">폴더 열기</button></div>
    <div class="search"><input id="q" placeholder="파일 검색  ( / )"></div>
    <div class="scroll" id="tree"></div>
  </aside>

  <div id="center">
    <div id="tabbar">
      <div id="tabs"></div>
      <button class="icon-btn" id="newTab" title="새 문서 (Alt+N)">＋</button>
      <div class="spacer"></div>
      <div class="seg" id="modeSeg">
        <button data-mode="view">보기</button><button data-mode="edit">편집</button><button data-mode="split">분할</button>
      </div>
      <button class="icon-btn" id="saveBtn" title="저장 (Ctrl+S)">저장</button>
    </div>
    <div id="panes">
      <div id="editorPane"><textarea id="editor" spellcheck="false" placeholder="마크다운을 입력하세요"></textarea></div>
      <div id="scroller">
        <div id="welcome">
          <div class="box">
            <h2>읽을 문서를 열어보세요</h2>
            <div>폴더를 열면 왼쪽에서 문서를 탐색할 수 있고,<br>.md 파일을 창에 끌어다 놓아도 됩니다.</div>
            <div class="actions">
              <button class="primary" id="welcomeFolder">폴더 열기</button>
              <button class="secondary" id="welcomeFile">파일 열기</button>
              <button class="secondary" id="welcomeNew">새 문서</button>
            </div>
          </div>
        </div>
        <article id="view" hidden></article>
      </div>
    </div>
  </div>

  <aside class="side" id="outline">
    <div class="side-head"><span>이 문서의 목차</span></div>
    <div class="scroll" id="tocList"></div>
  </aside>
</div>

<footer>
  <span class="path" id="stPath">준비됨</span>
  <span id="stCount"></span>
  <span id="stTime"></span>
  <span class="bar"><i id="bar"></i></span>
  <span id="stPct">0%</span>
</footer>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const root = document.documentElement;
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const dialog = window.__TAURI__.dialog;
const norm = p => p.replace(/\\/g, '/');
const joinPath = (a, b) => a.replace(/\/$/, '') + '/' + b;
const isMd = n => /\.(md|markdown|mdx|txt)$/i.test(n);
const dirname = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const basename = p => p.split('/').at(-1);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

// ================= settings =================
let size = +store.get('size', 18);
let mode = store.get('mode', 'view');   // view | edit | split
function applySettings() {
  const theme = store.get('theme', 'white'), font = store.get('font', 'sans');
  root.dataset.theme = theme; root.dataset.font = font;
  root.style.setProperty('--font-size', size + 'px');
  document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('on', b.dataset.theme === theme));
  document.querySelectorAll('[data-font]').forEach(b => b.classList.toggle('on', b.dataset.font === font));
  const f = store.get('files', '1') === '1', t = store.get('toc', '1') === '1';
  $('#files').classList.toggle('hidden', !f); $('#outline').classList.toggle('hidden', !t);
  $('#toggleFiles').classList.toggle('on', f); $('#toggleToc').classList.toggle('on', t);
}
function applyMode() {
  document.body.dataset.mode = active ? mode : 'view';
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('#modeSeg').hidden = !active; $('#saveBtn').hidden = !active;
}
function setMode(m) {
  mode = m; store.set('mode', m); applyMode();
  if (active && m !== 'view') { $('#editor').focus(); }
  if (active) renderPreview(true);
}
document.querySelectorAll('button[data-theme]').forEach(b => b.onclick = () => { store.set('theme', b.dataset.theme); applySettings(); });
document.querySelectorAll('button[data-font]').forEach(b => b.onclick = () => { store.set('font', b.dataset.font); applySettings(); });
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#fontUp').onclick = () => { size = Math.min(28, size + 1); store.set('size', size); applySettings(); };
$('#fontDown').onclick = () => { size = Math.max(13, size - 1); store.set('size', size); applySettings(); };
const flip = k => { store.set(k, store.get(k, '1') === '1' ? '0' : '1'); applySettings(); };
$('#toggleFiles').onclick = () => flip('files');
$('#toggleToc').onclick = () => flip('toc');

document.addEventListener('keydown', e => {
  const typing = ['INPUT', 'TEXTAREA'].includes(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (active) saveTab(active); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e') { e.preventDefault(); if (active) setMode(mode === 'view' ? 'split' : 'view'); return; }
  if (e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newDoc(); return; }
  if (e.altKey && e.key.toLowerCase() === 'w') { e.preventDefault(); active && closeTab(active); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 't' || e.key === 'T') flip('toc');
  if (e.key === 'b' || e.key === 'B') flip('files');
  if (e.key === '+' || e.key === '=') $('#fontUp').click();
  if (e.key === '-') $('#fontDown').click();
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

// ================= file system (folder) =================
let fs = new Map();          // 상대경로 -> { path, abs }
let rootName = '';
const expanded = new Set(JSON.parse(store.get('expanded', '[]')));

let rootPath = '';           // 열린 폴더의 절대경로 ("/" 구분)

async function loadFolder(dir, autoOpen = true) {
  dir = norm(dir).replace(/\/$/, '');
  let files;
  try { files = await invoke('scan_dir', { root: dir }); }
  catch (e) { toast('폴더를 열 수 없습니다: ' + e); return false; }
  fs = new Map(files.map(p => [p, { path: p, abs: joinPath(dir, p) }]));
  rootPath = dir; rootName = basename(dir) || dir;
  store.set('folder', dir);
  afterFolderLoad(autoOpen);
  return true;
}
function afterFolderLoad(autoOpen) {
  $('#folderName').textContent = rootName;
  renderTree();
  if (!autoOpen) return;
  const mdFiles = [...fs.keys()].filter(isMd).sort();
  const target = mdFiles.find(p => /^readme\.md$/i.test(p)) || mdFiles[0];
  if (target) openFromFs(target);
}
async function pickFolder() {
  const dir = await dialog.open({ directory: true, multiple: false, defaultPath: rootPath || undefined });
  if (dir) loadFolder(dir);
}
async function pickFiles() {
  const sel = await dialog.open({ multiple: true, filters: [{ name: 'Markdown', extensions: ['md', 'markdown', 'mdx', 'txt'] }] });
  for (const p of [].concat(sel || [])) await openAbs(norm(p));
}
// 절대경로로 열기: 열린 폴더 안이면 탐색기 항목으로, 밖이면 독립 탭으로
async function openAbs(abs) {
  if (rootPath && abs.startsWith(rootPath + '/') && fs.has(abs.slice(rootPath.length + 1))) return openFromFs(abs.slice(rootPath.length + 1));
  return openLoose(abs);
}
// 명령줄/드롭으로 받은 경로 처리 (폴더면 폴더 열기, 파일이면 탭)
async function openAnyPath(p) {
  p = norm(p);
  const kind = await invoke('path_kind', { path: p });
  if (kind === 'dir') return loadFolder(p);
  if (kind === 'file' && isMd(p)) return openAbs(p);
  if (kind === 'none') toast('경로를 찾을 수 없습니다: ' + p);
}
$('#openFolder').onclick = $('#welcomeFolder').onclick = pickFolder;
$('#openFile').onclick = $('#welcomeFile').onclick = pickFiles;
$('#welcomeNew').onclick = $('#newTab').onclick = () => newDoc();

// ---- tree ----
function buildTree() {
  const rootNode = { dirs: new Map(), files: [] };
  for (const p of [...fs.keys()].filter(isMd).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }))) {
    const parts = p.split('/'); let n = rootNode;
    for (const d of parts.slice(0, -1)) {
      if (!n.dirs.has(d)) n.dirs.set(d, { dirs: new Map(), files: [] });
      n = n.dirs.get(d);
    }
    n.files.push({ name: parts.at(-1), path: p });
  }
  return rootNode;
}
const hasMd = node => node.files.length || [...node.dirs.values()].some(hasMd);

async function renderTree() {
  const el = $('#tree'); el.innerHTML = '';
  const q = $('#q').value.trim().toLowerCase();
  const mdPaths = [...fs.keys()].filter(isMd);

  if (!mdPaths.length) {
    const d = document.createElement('div'); d.className = 'empty';
    d.innerHTML = fs.size ? '이 폴더에는 마크다운 파일이 없습니다.' : '열린 폴더가 없습니다.<br>폴더를 열어 문서를 탐색하세요.';
    const b = document.createElement('button'); b.className = 'primary'; b.textContent = '폴더 열기'; b.onclick = pickFolder;
    d.appendChild(b);
    el.appendChild(d); return;
  }
  if (q) {
    const hits = mdPaths.filter(p => p.toLowerCase().includes(q)).sort();
    if (!hits.length) { el.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>'; return; }
    hits.forEach(p => el.appendChild(fileRow(basename(p), p, 0, dirname(p))));
    return;
  }
  (function walk(node, depth, prefix) {
    for (const [name, child] of [...node.dirs].sort((a, b) => a[0].localeCompare(b[0], 'ko'))) {
      if (!hasMd(child)) continue;
      const path = prefix + name, open = expanded.has(path);
      const row = document.createElement('div'); row.className = 'row'; row.style.paddingLeft = 6 + depth * 14 + 'px';
      row.classList.add('dir');
      row.innerHTML = `<span class="ico">${open ? '▾' : '▸'}</span><span class="fold">${open ? '📂' : '📁'}</span><span class="name"></span>`;
      row.querySelector('.name').textContent = name;
      row.onclick = () => { open ? expanded.delete(path) : expanded.add(path); store.set('expanded', JSON.stringify([...expanded])); renderTree(); };
      el.appendChild(row);
      if (open) walk(child, depth + 1, path + '/');
    }
    node.files.forEach(f => el.appendChild(fileRow(f.name.replace(/\.(md|markdown|mdx)$/i, ''), f.path, depth)));
  })(buildTree(), 0, '');
}
function fileRow(label, path, depth, sub) {
  const t = tabs.find(t => !t.loose && t.path === path);
  const row = document.createElement('div');
  row.className = 'row' + (active && !active.loose && active.path === path ? ' active' : '');
  row.style.paddingLeft = 6 + depth * 14 + 'px';
  row.innerHTML = '<span class="ico">▤</span><span class="name"></span>' + (sub ? '<span class="sub"></span>' : '') + (t && isDirty(t) ? '<span class="dot"></span>' : '');
  row.querySelector('.name').textContent = label;
  if (sub) row.querySelector('.sub').textContent = sub;
  row.title = path;
  row.onclick = () => openFromFs(path);
  return row;
}
$('#q').oninput = renderTree;

// ================= tabs =================
let tabs = [];
let active = null;
let seq = 0;
const isDirty = t => t.text !== t.saved;

// abs: 디스크 절대경로 (새 문서는 null) / path: 폴더 기준 상대경로 (loose 탭은 파일명)
function makeTab({ path, name, text, saved, abs, loose, pos }) {
  return { id: ++seq, path, name, text, saved: saved ?? text, abs: abs || null, loose: !!loose, pos: pos || 0, edPos: 0 };
}
async function openFromFs(path) {
  const ex = tabs.find(t => !t.loose && t.path === path);
  if (ex) return activate(ex);
  const entry = fs.get(path); if (!entry) return;
  let text;
  try { text = await invoke('read_text', { path: entry.abs }); } catch (e) { return toast('열 수 없습니다: ' + e); }
  const t = makeTab({ path, name: basename(path), text, abs: entry.abs });
  tabs.push(t); activate(t);
}
async function openLoose(abs) {
  const ex = tabs.find(t => t.abs === abs);
  if (ex) return activate(ex);
  let text;
  try { text = await invoke('read_text', { path: abs }); } catch (e) { return toast('열 수 없습니다: ' + e); }
  const t = makeTab({ path: basename(abs), name: basename(abs), text, abs, loose: true });
  tabs.push(t); activate(t);
}
function newDoc() {
  const t = makeTab({ path: '새 문서.md', name: '새 문서.md', text: '# 새 문서\n\n', saved: '', loose: true });
  tabs.push(t);
  if (mode === 'view') { mode = 'split'; store.set('mode', mode); }
  activate(t);
  $('#editor').focus(); $('#editor').setSelectionRange(8, 8);
}
function activate(t) {
  if (active && active !== t) { active.pos = $('#scroller').scrollTop; active.edPos = $('#editor').scrollTop; }
  active = t;
  $('#editor').value = t.text;
  applyMode(); renderTabs(); renderTree(); renderPreview(true);
  $('#editor').scrollTop = t.edPos;
  saveSession();
}
function closeTab(t) {
  if (isDirty(t) && !confirm(`"${t.name}" 에 저장하지 않은 변경사항이 있습니다.\n저장하지 않고 닫을까요?`)) return;
  const i = tabs.indexOf(t); tabs.splice(i, 1);
  if (active === t) {
    active = null;
    const next = tabs[i] || tabs[i - 1];
    if (next) return activate(next);
    $('#editor').value = '';
    applyMode(); renderTabs(); renderTree(); renderPreview(true); saveSession();
  } else { renderTabs(); renderTree(); saveSession(); }
}
function renderTabs() {
  const el = $('#tabs'); el.innerHTML = '';
  for (const t of tabs) {
    const d = document.createElement('div');
    d.className = 'tab' + (t === active ? ' active' : '') + (isDirty(t) ? ' dirty' : '');
    d.title = t.path;
    d.innerHTML = '<span class="t"></span><span class="x"><span>×</span></span>';
    d.querySelector('.t').textContent = t.name;
    d.onclick = e => e.target.closest('.x') ? closeTab(t) : activate(t);
    d.onauxclick = e => { if (e.button === 1) closeTab(t); };
    el.appendChild(d);
    if (t === active) requestAnimationFrame(() => d.scrollIntoView({ block: 'nearest', inline: 'nearest' }));
  }
  $('#saveBtn').disabled = !active || !isDirty(active);
}

// ================= editing & saving =================
const editor = $('#editor');
let previewT;
editor.addEventListener('input', () => {
  if (!active) return;
  active.text = editor.value;
  renderTabs(); refreshDirtyDot();
  clearTimeout(previewT); previewT = setTimeout(() => renderPreview(false), 120);
  saveSession();
});
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, en = editor.selectionEnd;
    editor.setRangeText('  ', s, en, 'end');
    editor.dispatchEvent(new Event('input'));
  }
});
editor.addEventListener('scroll', () => {
  if (document.body.dataset.mode !== 'split') return;
  const sc = $('#scroller');
  const r = editor.scrollTop / Math.max(1, editor.scrollHeight - editor.clientHeight);
  sc.scrollTop = r * (sc.scrollHeight - sc.clientHeight);
});
function refreshDirtyDot() { renderTree(); }

async function saveTab(t) {
  try {
    if (!t.abs) {
      const p = await dialog.save({ defaultPath: (rootPath ? rootPath + '/' : '') + t.name, filters: [{ name: 'Markdown', extensions: ['md'] }] });
      if (!p) return;
      t.abs = norm(p); t.name = basename(t.abs); t.path = t.name;
      if (rootPath && t.abs.startsWith(rootPath + '/')) {   // 열린 폴더 안에 저장하면 탐색기 항목이 된다
        t.path = t.abs.slice(rootPath.length + 1); t.loose = false;
      }
    }
    await invoke('write_text', { path: t.abs, text: t.text });
    t.saved = t.text;
    if (!t.loose && rootPath && !fs.has(t.path)) fs.set(t.path, { path: t.path, abs: t.abs });
    toast('저장됨 · ' + t.name);
    renderTabs(); renderTree(); renderPreview(false); saveSession();
  } catch (e) {
    toast('저장 실패: ' + e);
  }
}
$('#saveBtn').onclick = () => active && saveTab(active);
addEventListener('beforeunload', e => { if (tabs.some(isDirty)) { e.preventDefault(); e.returnValue = ''; } });

// ================= render =================
marked.setOptions({ gfm: true, breaks: false });
const scroller = $('#scroller'), view = $('#view');
let blobUrls = [];

function renderPreview(restoreScroll) {
  const t = active;
  view.hidden = !t; $('#welcome').hidden = !!t;
  if (!t) {
    document.title = 'MdReader'; $('#crumb').textContent = '';
    $('#stPath').textContent = '준비됨'; $('#stCount').textContent = ''; $('#stTime').textContent = '';
    $('#tocList').innerHTML = ''; view.innerHTML = ''; onScroll(); return;
  }
  const keep = scroller.scrollTop;
  view.innerHTML = DOMPurify.sanitize(marked.parse(t.text));
  document.title = t.name + ' – MdReader';
  const dir = t.loose ? '' : dirname(t.path);
  $('#crumb').innerHTML = (dir ? dir.split('/').join(' / ') + ' / ' : '') + '<b></b>';
  $('#crumb b').textContent = t.name;
  $('#stPath').textContent = t.loose ? t.name : (rootName ? rootName + '/' : '') + t.path;
  const chars = t.text.replace(/\s/g, '').length;
  $('#stCount').textContent = chars.toLocaleString() + '자';
  $('#stTime').textContent = '약 ' + Math.max(1, Math.round(chars / 500)) + '분';

  view.querySelectorAll('pre code').forEach(el => {
    hljs.highlightElement(el);
    const btn = document.createElement('button'); btn.className = 'copy'; btn.textContent = '복사';
    btn.onclick = () => navigator.clipboard.writeText(el.textContent).then(() => { btn.textContent = '복사됨'; setTimeout(() => btn.textContent = '복사', 1200); });
    el.parentElement.appendChild(btn);
  });
  view.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  view.querySelectorAll('input[type=checkbox]').forEach(c => c.disabled = true);
  if (t.abs) resolveImages(dirname(t.abs));
  buildToc();
  scroller.scrollTop = restoreScroll ? t.pos : keep;
  onScroll();
}

function resolvePath(dir, href) {
  const out = dir ? dir.split('/') : [];
  for (const seg of decodeURI(href).split('/')) {
    if (seg === '..') out.pop(); else if (seg && seg !== '.') out.push(seg);
  }
  return out.join('/');
}
const IMG_TYPES = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp', avif: 'image/avif' };
async function resolveImages(absDir) {
  blobUrls.forEach(URL.revokeObjectURL); blobUrls = [];
  const target = active;
  for (const img of view.querySelectorAll('img')) {
    const src = img.getAttribute('src') || '';
    if (/^(https?:|data:|blob:)/.test(src)) continue;
    const abs = /^[a-zA-Z]:[\\/]/.test(src) ? norm(src) : resolvePath(absDir, src.split('#')[0]);
    try {
      const buf = await invoke('read_bytes', { path: abs });
      if (active !== target || !img.isConnected) return;
      const u = URL.createObjectURL(new Blob([buf], { type: IMG_TYPES[abs.split('.').pop().toLowerCase()] || 'application/octet-stream' }));
      blobUrls.push(u); img.src = u;
    } catch {}
  }
}
view.addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  const href = a.getAttribute('href') || '';
  if (/^(https?:|mailto:)/.test(href)) return;
  e.preventDefault();
  if (href.startsWith('#')) { document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView(); return; }
  if (!active.abs) return;
  const [p, hash] = href.split('#');
  const target = resolvePath(dirname(active.abs), p);
  if (isMd(target)) openAbs(target).then(() => hash && document.getElementById(decodeURIComponent(hash))?.scrollIntoView());
});

function buildToc() {
  const list = $('#tocList'); list.innerHTML = '';
  const used = new Set(), hs = view.querySelectorAll('h1,h2,h3,h4');
  if (!hs.length) { list.innerHTML = '<div class="empty">제목이 없습니다.</div>'; return; }
  const minLevel = Math.min(...[...hs].map(h => +h.tagName[1]));
  hs.forEach((h, i) => {
    let id = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'h' + i;
    while (used.has(id)) id += '-' + i;
    used.add(id); h.id = id;
    const a = document.createElement('a');
    a.href = '#' + id; a.textContent = h.textContent; a.className = 'l' + (+h.tagName[1] - minLevel + 1);
    a.onclick = e => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }); };
    list.appendChild(a);
  });
}

// ================= scroll state =================
let saveT;
function onScroll() {
  const max = scroller.scrollHeight - scroller.clientHeight;
  const pct = max > 0 ? Math.round(scroller.scrollTop / max * 100) : 0;
  $('#bar').style.width = pct + '%'; $('#stPct').textContent = pct + '%';
  let cur = null;
  view.querySelectorAll('h1,h2,h3,h4').forEach(h => { if (h.getBoundingClientRect().top < 140) cur = h.id; });
  let activeEl = null;
  document.querySelectorAll('#tocList a').forEach(a => { const on = a.getAttribute('href') === '#' + cur; a.classList.toggle('active', on); if (on) activeEl = a; });
  activeEl?.scrollIntoView({ block: 'nearest' });
  clearTimeout(saveT); saveT = setTimeout(() => { if (active) { active.pos = scroller.scrollTop; saveSession(); } }, 400);
}
scroller.addEventListener('scroll', onScroll);

// ================= session =================
function saveSession() {
  clearTimeout(saveSession.t);
  saveSession.t = setTimeout(() => {
    store.set('session', JSON.stringify({
      active: tabs.indexOf(active),
      tabs: tabs.map(t => ({ path: t.path, name: t.name, text: t.text, saved: t.saved, abs: t.abs, loose: t.loose, pos: t.pos }))
    }));
  }, 300);
}

// ================= drag & drop =================
window.__TAURI__.webview.getCurrentWebview().onDragDropEvent(async ev => {
  const p = ev.payload;
  if (p.type === 'enter' || p.type === 'over') document.body.classList.add('dragging');
  else document.body.classList.remove('dragging');
  if (p.type === 'drop') for (const path of p.paths) await openAnyPath(path);
});
// `mdr <경로>` 를 이미 실행 중인 창에 다시 호출했을 때
listen('open-path', e => openAnyPath(e.payload));

// ================= init =================
applySettings();
try {
  const s = JSON.parse(store.get('session', 'null'));
  if (s?.tabs?.length) {
    tabs = s.tabs.map(makeTab);
    active = tabs[s.active] || tabs[0];
    $('#editor').value = active.text;
  }
} catch {}
applyMode(); renderTabs(); renderTree(); renderPreview(true);

(async () => {
  const launch = await invoke('launch_path');
  if (launch) {                       // mdr . / mdr 폴더 / mdr 파일.md
    await openAnyPath(launch);
    return;
  }
  const last = store.get('folder', '');   // 인자가 없으면 마지막 폴더를 복원
  if (last && await invoke('path_kind', { path: last }) === 'dir') loadFolder(last, false);
})();

// ================= 자동 업데이트 (GitHub Releases) =================
async function checkForUpdate() {
  try {
    const update = await window.__TAURI__.updater.check();
    if (!update) return;
    const unsaved = tabs.some(isDirty) ? '\n(저장하지 않은 편집 내용은 업데이트 후에도 복원됩니다.)' : '';
    const ok = await dialog.ask(`새 버전 ${update.version} 이(가) 있습니다.\n지금 업데이트할까요?${unsaved}`, { title: 'MdReader 업데이트', kind: 'info', okLabel: '업데이트', cancelLabel: '나중에' });
    if (!ok) return;
    toast('업데이트를 내려받는 중…');
    await update.downloadAndInstall();
    await window.__TAURI__.process.relaunch();
  } catch (e) { console.warn('update check failed', e); }   // 오프라인이거나 개발 빌드면 조용히 넘어간다
}
setTimeout(checkForUpdate, 3000);
</script>
